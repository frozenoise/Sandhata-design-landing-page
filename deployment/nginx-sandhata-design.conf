# /etc/nginx/sites-available/sandhata-design
# Reverse proxy in front of `next start` on 127.0.0.1:3100.
# Replace server_name with the real domain, then run certbot for HTTPS.
server {
    listen 80;
    server_name 10.30.1.145;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;   # /api/generate streams from the Anthropic API
    }
}
